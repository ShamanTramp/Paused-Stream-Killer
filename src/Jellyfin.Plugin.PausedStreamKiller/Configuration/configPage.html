<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Paused Stream Killer</title>
</head>
<body>
    <div id="PausedStreamKillerConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="PausedStreamKillerConfigForm">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="EnableAutomaticStop" name="EnableAutomaticStop" type="checkbox" is="emby-checkbox" />
                            <span data-fr="Arrêter automatiquement les lectures restées en pause" data-en="Automatically stop playback that has been paused">Automatically stop playback that has been paused</span>
                        </label>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="PauseTimeoutMinutes" data-fr="Délai avant l’arrêt (minutes)" data-en="Stop after (minutes)">Stop after (minutes)</label>
                        <input id="PauseTimeoutMinutes" name="PauseTimeoutMinutes" type="number" is="emby-input" min="1" max="1440" step="1" required />
                        <div class="fieldDescription" data-fr="Le contrôle des sessions s’effectue chaque minute. Délai par défaut : 30 minutes." data-en="Sessions are checked every minute. Default timeout: 30 minutes.">Sessions are checked every minute. Default timeout: 30 minutes.</div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="IncludeAudioPlayback" name="IncludeAudioPlayback" type="checkbox" is="emby-checkbox" />
                            <span data-fr="Inclure les lectures audio" data-en="Include audio playback">Include audio playback</span>
                        </label>
                        <div class="fieldDescription" data-fr="Désactivé par défaut." data-en="Off by default.">Off by default.</div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="IncludeSyncPlaySessions" name="IncludeSyncPlaySessions" type="checkbox" is="emby-checkbox" />
                            <span data-fr="Inclure les sessions SyncPlay" data-en="Include SyncPlay sessions">Include SyncPlay sessions</span>
                        </label>
                        <div class="fieldDescription" data-fr="Désactivé par défaut. Seul le client en pause sera arrêté." data-en="Off by default. Only the paused client will be stopped.">Off by default. Only the paused client will be stopped.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span data-fr="Enregistrer" data-en="Save">Save</span></button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            const PausedStreamKillerConfig = { pluginUniqueId: '2b3626af-525d-4be0-900e-c2c146b36f05' };
            const configPage = document.querySelector('#PausedStreamKillerConfigPage');
            const jellyfinCulture = window.globalize && window.globalize.currentCulture;
            const cultureCode = typeof jellyfinCulture === 'string'
                ? jellyfinCulture
                : jellyfinCulture && jellyfinCulture.name
                    ? jellyfinCulture.name
                    : document.documentElement.lang || navigator.language || 'en';
            const language = cultureCode.toLowerCase().startsWith('fr') ? 'fr' : 'en';
            configPage.lang = language;
            configPage.querySelectorAll('[data-en][data-fr]').forEach(function (element) {
                element.textContent = element.dataset[language];
            });
            configPage.addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(PausedStreamKillerConfig.pluginUniqueId).then(function (config) {
                    document.querySelector('#EnableAutomaticStop').checked = config.EnableAutomaticStop !== false;
                    document.querySelector('#PauseTimeoutMinutes').value = config.PauseTimeoutMinutes || 30;
                    document.querySelector('#IncludeAudioPlayback').checked = config.IncludeAudioPlayback === true;
                    document.querySelector('#IncludeSyncPlaySessions').checked = config.IncludeSyncPlaySessions === true;
                    Dashboard.hideLoadingMsg();
                });
            });
            document.querySelector('#PausedStreamKillerConfigForm').addEventListener('submit', function (event) {
                event.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(PausedStreamKillerConfig.pluginUniqueId).then(function (config) {
                    config.EnableAutomaticStop = document.querySelector('#EnableAutomaticStop').checked;
                    config.PauseTimeoutMinutes = Math.min(1440, Math.max(1, Number(document.querySelector('#PauseTimeoutMinutes').value) || 30));
                    config.IncludeAudioPlayback = document.querySelector('#IncludeAudioPlayback').checked;
                    config.IncludeSyncPlaySessions = document.querySelector('#IncludeSyncPlaySessions').checked;
                    ApiClient.updatePluginConfiguration(PausedStreamKillerConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
                return false;
            });
        </script>
    </div>
</body>
</html>
