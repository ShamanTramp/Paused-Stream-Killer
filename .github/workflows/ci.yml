name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore Jellyfin.Plugin.PausedStreamKiller.sln
      - run: dotnet build Jellyfin.Plugin.PausedStreamKiller.sln -c Release --no-restore -m:1
      - run: dotnet test Jellyfin.Plugin.PausedStreamKiller.sln -c Release --no-build --no-restore -m:1
